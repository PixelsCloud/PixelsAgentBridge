[package]
license = "PolyForm-Noncommercial-1.0.0"
name = "pab-desktop"
version = "1.2.49"
description = "Pixels Agent Bridge desktop application"
authors = ["Pixels"]
edition = "2024"
rust-version = "1.95"

[lib]
name = "pab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tauri = { version = "2", features = ["tray-icon"] }
pab-executor = { path = "../../../crates/executor" }
pab-bridge = { path = "../../../crates/bridge" }
pab-agent-core = { path = "../../../crates/agent-core" }
pab-service-config = { path = "../../../crates/service-config" }
pab-logging = { path = "../../../crates/logging" }
pab-protocol = { path = "../../../crates/protocol" }
pab-desktop-control = { path = "../../../crates/desktop-control" }
pab-desktop-media = { path = "../../../crates/desktop-media" }
pab-remote-desktop = { path = "../../../crates/remote-desktop" }
pab-screenshot = { path = "../../../crates/screenshot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
toml_edit = "0.25"
serde_yaml_ng = "0.10"
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
tempfile = "3"
tracing = "0.1"
tokio = { version = "1", features = ["io-util", "net", "process", "signal", "sync", "time"] }
zeroize = "1"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
webbrowser = "1"
encoding_rs = "0.8"
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Environment", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
gtk = "0.18"
enigo = { version = "=0.5.0", default-features = false, features = ["x11rb"] }
pab-os-control = { path = "../../../crates/os-control" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
xcap = "=0.8.2"
[profile.release]
# Desktop releases favor short edit/build cycles over whole-program optimization.
codegen-units = 16
lto = false
opt-level = 2
incremental = true
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = 3

[patch.crates-io]
iroh = { path = "../../../vendor/iroh" }
enigo = { path = "../../../vendor/enigo" }
libspa = { path = "../../../vendor/libspa" }
