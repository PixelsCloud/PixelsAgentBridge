[package]
name = "pab-desktop"
version = "0.1.0"
description = "Pixels Agent Bridge desktop application"
authors = ["Pixels"]
edition = "2024"
rust-version = "1.95"

[lib]
name = "pab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tauri = { version = "2", features = [] }
pab-executor = { path = "../../../crates/executor" }
pab-bridge = { path = "../../../crates/bridge" }
pab-agent-core = { path = "../../../crates/agent-core" }
pab-logging = { path = "../../../crates/logging" }
pab-protocol = { path = "../../../crates/protocol" }
pab-screenshot = { path = "../../../crates/screenshot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
tracing = "0.1"
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }
zeroize = "1"
base64 = "0.22"
url = "2"
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "=0.5.0", default-features = false, features = ["x11rb"] }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
xcap = "=0.8.2"
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
