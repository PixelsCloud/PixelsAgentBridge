name: macOS signing check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r smoke/requirements.txt
      - name: Verify the existing identity before native compilation
        env:
          PAB_MACOS_SIGNING_STATE_DIR: ${{ runner.temp }}/pab-signing-check
          PAB_MACOS_SIGNING_P12_BASE64: ${{ secrets.PAB_MACOS_SIGNING_P12_BASE64 }}
          PAB_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.PAB_MACOS_SIGNING_P12_PASSWORD }}
          PAB_MACOS_CERT_SHA1: ${{ vars.PAB_MACOS_CERT_SHA1 }}
        run: python scripts/macos_signing.py import-ci
