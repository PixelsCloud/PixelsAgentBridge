name: Publish qualified release
on:
  workflow_run:
    workflows: [Release smoke qualification]
    types: [completed]
permissions:
  contents: read
  actions: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  context:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      candidate_run: ${{ steps.context.outputs.candidate_run }}
      commit: ${{ steps.context.outputs.commit }}
    steps:
      # Workflow-run input is untrusted until checked. Inspect it using main's
      # implementation before checking out the candidate or granting write access.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_RUN: ${{ github.event.workflow_run.id }}
        run: python scripts/github_release.py check-run --repo "$GITHUB_REPOSITORY" --run-id "$SMOKE_RUN" --workflow release-smoke.yml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .build/github-release/context
      - id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_release.py context --file .build/github-release/context/context.json --repo "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
  publish:
    needs: context
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: publish-${{ needs.context.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.context.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r smoke/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          run-id: ${{ needs.context.outputs.candidate_run }}
          github-token: ${{ github.token }}
          path: .build/github-release/bundle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qualification-*
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: smoke/runs
      - name: Recheck signature, complete smoke, remote bytes and publish
        env:
          TAG: ${{ needs.context.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          PAB_RELEASE_PUBLIC_KEY_BASE64: ${{ vars.PAB_RELEASE_PUBLIC_KEY_BASE64 }}
          PAB_SERVICE_RELEASE_PUBLIC_KEY_BASE64: ${{ vars.PAB_SERVICE_RELEASE_PUBLIC_KEY_BASE64 }}
        run: python scripts/github_release.py publish --tag "$TAG" --directory .build/github-release/bundle --repo "$GITHUB_REPOSITORY" --reports smoke/runs
