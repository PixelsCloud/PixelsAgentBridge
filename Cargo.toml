[workspace]
members = [
    "crates/agent-core",
    "crates/executor",
    "crates/platform",
    "crates/protocol",
    "crates/relay",
    "crates/server",
    "crates/task-runtime",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[patch.crates-io]
iroh-relay = { path = "vendor/iroh-relay" }

[profile.dev]
debug = 1

[profile.test]
debug = 1
