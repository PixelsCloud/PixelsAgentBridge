[workspace]
members = [
    "crates/agent-core",
    "crates/bridge",
    "crates/executor",
    "crates/logging",
    "crates/platform",
    "crates/protocol",
    "crates/relay",
    "crates/server",
    "crates/task-runtime",
    "crates/transport",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[patch.crates-io]
iroh-relay = { path = "vendor/iroh-relay" }

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
debug = 0
strip = "symbols"
