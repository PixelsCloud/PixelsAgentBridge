[workspace]
members = [
    "crates/protocol",
    "crates/relay",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[patch.crates-io]
iroh-relay = { path = "vendor/iroh-relay" }

[profile.dev]
debug = 1

[profile.test]
debug = 1
