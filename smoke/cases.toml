# Maintained case definitions. Observations and credentials never belong here.
schema_version = 1

[[case]]
id = "AUTO-15"
title = "远程桌面流控、显示确认和恢复回归"
targets = ["windows", "macos", "linux", "linux-desktop"]
level = "quick"
adapter = "cargo-remote-desktop"
prerequisite = "原生工具链和 Rust 依赖完整；确认整机编译并发预算。使用 loopback QUIC，不连接生产设备。"
steps = ["执行远程桌面单元测试，检查确认回复延迟、窗口上限及有序操作。", "执行 reliable_sessions 的真实 loopback QUIC 集成测试。"]
expected = ["控制流水线最多八条消息在途，视频最多四帧在途；心跳／输入回复延迟不阻塞显示确认；输入修改串行，切屏隔离旧确认；错序或超时退出且不重放输入。", "视频背压、代次隔离、恢复及输入释放全部实际通过，无跳过。"]
cleanup = "回收本次 loopback 端点和任务；不改变安装、账号、屏幕或网络配置。"

[[case]]
id = "AUTO-16"
title = "Windows 媒体等待、进程优先级和显示布局保护"
targets = ["windows"]
level = "quick"
adapter = "cargo-media-timing"
prerequisite = "Windows 原生工具链完整；可枚举至少一块显示器，不需要账号，不采集桌面。"
steps = ["执行 windows_media_timing 的原生定时器测试。", "从低优先级父进程启动生产媒体适配器并核对实际子进程。", "检查当前输出，分别注入过期分辨率、旋转、显示器句柄和 DPI 元数据。"]
expected = ["等待不少于请求期限、旧系统定时器回退可用、句柄释放；报告实际等待耗时。", "生产媒体启动适配器从后台父进程恢复子进程的正常优先级，无跳过。", "当前布局通过；过期布局全部拒绝，不改变真实显示设置。"]
cleanup = "结束本次创建的独立测试进程；不修改全局计时精度或其他进程优先级。"

[[case]]
id = "AUTO-17"
title = "远程桌面 BGRA 转换一致性与耗时"
targets = ["windows", "macos", "linux", "linux-desktop"]
level = "quick"
adapter = "cargo-media-conversion"
prerequisite = "原生媒体工具链完整；仅使用内存中的合成像素，无需账号或远程设备。"
steps = ["执行 software::conversion_tests，比较 BT.709 标量和 SIMD 的完整 Y/U/V 数据。", "检查非对齐输入、行填充、截断和溢出尺寸，并报告 1080p 转换耗时。"]
expected = ["随机图、黑白和原色逐字节一致；透明度不影响转换；不支持 SIMD 时保留标量路径。", "无效输入拒绝且不修改输出；耗时仅用于诊断，不冒充显示帧率，也不设置依赖机器负载的速度门槛。"]
cleanup = "释放内存和测试进程；不读写用户画面，不修改安装。"

[[case]]
id = "INT-01"
title = "最新版管理平台、Relay 与客户端联调"
targets = ["management","relay","server","windows","macos","linux","linux-desktop","android"]
level = "release"
prerequisite = "管理平台、双 Relay 和客户端均使用本次最新候选产物，记录实际发布版本及 SHA-256；使用隔离数据库与测试账号。"
steps = ["部署最新版三个组件，完成登录、设备上线、实际 Relay 传输与 P2P 连接。", "验证策略下发、节点维护/恢复、连接与用量统计，以及控制服务断线重连。", "重启测试服务与客户端，重新连接并核对账号、设备身份、用量和配置。"]
expected = ["参与联调的组件均为最新候选产物，登录与两种连接路径实际成功。", "策略生效、真实操作确认及计量正确，恢复后可建立新链路。", "最新版整套功能正常，设备身份、账号、用量与配置保留。"]
cleanup = "恢复测试节点，清理本次会话与独立数据库，保留逐步观察记录。"

[[case]]
id = "SRV-02"
title = "Relay 独立部署、升级与恢复"
targets = ["relay"]
level = "release"
prerequisite = "仅使用 Relay 候选归档或镜像及已准备的隔离管理平台；记录节点 ID、证书、配置与用量存储摘要。"
steps = ["仅用 Relay 产物在测试主机部署并连接管理平台，执行真实中继传输。", "进入维护，升级一个节点，验证备用节点与原连接的实际行为。", "恢复节点并演练受支持的回退，核对原身份、配置及用量。"]
expected = ["无需客户端安装包或 Web 资源，探针与真实传输均成功。", "升级只更换目标 Relay，备用服务可用，不修改管理平台数据库。", "身份、证书、配置和待报用量保留，新链路实际可用。"]
cleanup = "恢复测试节点与连接状态，不清空用量卷，不替换私钥或设备身份。"

[[case]]
id = "AUTO-14"
title = "服务端数据库、TLS 与双 Relay 集成"
targets = ["server","management","relay"]
level = "release"
adapter = "cargo-service"
prerequisite = "已创建归本次测试所有的 loopback PostgreSQL 夹具；Rust 依赖完整。"
steps = ["用独立数据库运行 Server 和 Relay 的全部集成测试，串行执行并保留失败。"]
expected = ["TLS、注册登录、权限、用量聚合、维护切换、带宽策略与跨节点真实流量断言全部通过；不接受跳过。"]
cleanup = "各测试回收自己创建的端点和监听器；统一测试结束后销毁本次数据库夹具。"

[[case]]
id = "AUTO-13"
title = "Android 真机与隔离 TLS Relay"
targets = ["android"]
level = "release"
adapter = "android-relay"
prerequisite = "显式配置测试手机；已安装同哈希的 debug APK；无障碍已授权；已构建 MCP 和 remote-fixture。"
steps = ["保留设备配置，临时断开普通连接并通过 ADB reverse 连接独立 TLS Relay。", "验证配对、中文输入、原生点击手势、截图、重复请求及重连查询，恢复普通服务。"]
expected = ["隔离链路实际为 Relay；错误密码被拒绝，Android 身份正确。", "业务结果逐项断言通过，原连接意图与暂停状态恢复；这不替代公网或切网验收。"]
cleanup = "关闭自建 MCP/服务、撤销本次 ADB reverse、清理夹具文件并恢复原服务连接；不卸载或清数据。"

[[case]]
id = "AUTO-12"
title = "Linux 引导安装、签名及兼容性检查"
targets = ["linux", "linux-desktop"]
level = "quick"
adapter = "python-linux"
prerequisite = "Linux 宿主或 Linux 测试容器；不在 Windows 上把跳过当作通过。"
steps = ["执行 Linux 引导器的临时目录测试。"]
expected = ["签名、损坏下载、归档逃逸及 libc 兼容检查全部实际通过。"]
cleanup = "移除测试创建的临时目录，不安装或改变本机产品。"

