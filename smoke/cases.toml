level = "release"
prerequisite = "干净的专用虚拟机或测试设备；Android 不得在主测试手机卸载清数据来制造干净环境。"
steps = ["在干净的专用测试环境安装候选包并启动。","核对客户端、后台、MCP 或 APK 的实际版本和身份。","重启测试环境并再次连接。"]
expected = ["安装成功，服务和界面按产品启动规则运行，无崩溃。","与候选版本及产物清单一致，非旧进程或旧资源。","设备身份稳定，正常上线并执行一次读取操作。"]
cleanup = "关闭测试会话；保留设备身份、签名和数据，不修改日常工作机安装。"

