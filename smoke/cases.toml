targets = ["server","management","relay"]
level = "release"
adapter = "cargo-service"
prerequisite = "已创建归本次测试所有的 loopback PostgreSQL 夹具；Rust 依赖完整。"
steps = ["用独立数据库运行 Server 和 Relay 的全部集成测试，串行执行并保留失败。"]
expected = ["TLS、注册登录、权限、用量聚合、维护切换、带宽策略与跨节点真实流量断言全部通过；不接受跳过。"]
cleanup = "各测试回收自己创建的端点和监听器；统一测试结束后销毁本次数据库夹具。"

[[case]]
id = "AUTO-13"
title = "Android 真机与隔离 TLS Relay"
targets = ["android"]
level = "release"
adapter = "android-relay"
prerequisite = "显式配置测试手机；已安装同哈希的 debug APK；无障碍已授权；已构建 MCP 和 remote-fixture。"
steps = ["保留设备配置，临时断开普通连接并通过 ADB reverse 连接独立 TLS Relay。", "验证配对、中文输入、原生点击手势、截图、重复请求及重连查询，恢复普通服务。"]
expected = ["隔离链路实际为 Relay；错误密码被拒绝，Android 身份正确。", "业务结果逐项断言通过，原连接意图与暂停状态恢复；这不替代公网或切网验收。"]
cleanup = "关闭自建 MCP/服务、撤销本次 ADB reverse、清理夹具文件并恢复原服务连接；不卸载或清数据。"

