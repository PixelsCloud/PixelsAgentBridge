# Maintained case definitions. Observations and credentials never belong here.
schema_version = 1

[[case]]
id = "AUTO-25"
title = "Linux 旧 DRM/libc 头文件原生编译与 pidfd 参数保留"
targets = ["linux", "linux-desktop"]
level = "quick"
adapter = "linux-media-compat"
prerequisite = "Linux g++、pkg-config 和 libdrm 开发头文件可用；预留一个编译任务额度。"
steps = ["顺序编译并运行系统宏和旧头文件回退两个原生探针。", "验证连接器名称、未知类型拒绝、原 pidfd/描述符/flags 和权限错误保留。"]
expected = ["两组探针实际成功；缺编译器或开发头文件不能算通过。", "不按 PID 重新打开文件、不吞权限错误；探针不访问显示、GPU 或安装应用。"]
cleanup = "回收本用例独立临时编译目录，保留编译/执行日志与候选哈希；清理失败使适配器失败。"

[[case]]
id = "AUTO-24"
title = "双机器隔离网络中的原生批次双向传输"
targets = ["windows", "macos", "linux", "linux-desktop"]
level = "release"
adapter = "file-transfer-lab"
prerequisite = "显式配置 file_transfer_lab.enabled、lab、mcp；正常 Pixels 配对；两机适配产物与 SHA-256；共享 LAN 或专用测试 Relay。临时合成端点不适用于要求正式登记的生产 Relay，不能放宽生产策略。"
steps = ["通过 Pixels 传输并核对两机 libtest 产物，创建本次 UUID 根和 TOML 配置。", "通过 Pixels 交换并核对临时公钥 offer，执行 SDK 到原生 Executor 的 16 MiB 双向目录批次。", "收集两端完成结果、完整性和实际路由，等待所有夹具停止再清理。"]
expected = ["两端测试真实通过，完整二进制、零字节、中文名和空目录一致。", "严格 relay 模式不允许直连替代；不接受连接成功但未完成数据收发。", "任何未知提交都不重复执行；活动或结果未知的夹具不提前删除。本用例不替代正常产品认证、桌面 UI、双生产 Relay、故障和长稳验收。"]
cleanup = "仅清理本次已创建且进程已确认停止的 UUID 测试根；清理不完整使本用例失败，保留原请求和报告。"

[[case]]
id = "AUTO-23"
title = "独立传输批次：SDK、QUIC 与实际 Executor"
targets = ["windows", "macos", "linux", "linux-desktop"]
level = "quick"
adapter = "cargo-file-batches"
prerequisite = "锁定的原生构建依赖与 loopback QUIC 可用；所有账号与数据均为隔离合成夹具。"
steps = ["通过实际批次调度器和 Executor 双向传输文件树、空目录、零字节文件和中文名称。", "处理询问冲突后的替换、跳过和保留两份，核对逐文件用量。", "在接收端确定性检查点阻塞数据流；发送暂停或取消，观察接收端确认，再恢复新 attempt。"]
expected = ["逐字节一致，逻辑文件统计无批次重复计数，其他账号看不到任务。", "停止意图不伪造完成；停止与恢复前原目标保持不变，原 attempt 事实不被重写。", "仅此隔离协议用例通过不代表跨机器路由、原生窗口和长稳验收已通过。"]
cleanup = "关闭本次合成账号 runtime、QUIC 端点与 SQLite，回收测试创建的临时目录；不读写已安装应用或桌面。"

[[case]]
id = "AUTO-21"
title = "Bridge 文件收发、身份、原生路径与显式续传"
targets = ["windows", "macos", "linux", "linux-desktop"]
level = "quick"
adapter = "cargo-file-transfer-wire"
prerequisite = "原生 Rust 工具链、锁定依赖和 loopback QUIC 可用；整机编译预算可用。"
steps = ["运行 Bridge 的真实 QUIC 文件协议场景。", "验证服务与用户身份、拒绝旧能力或身份改变、显式校验续传，以及 v3 原生路径双向传递。"]
expected = ["完整源字节和 SHA-256 一致，接收发布前不报成功。", "请求保留原始路径编码，原身份与原请求归属不变；拒绝时不发送文件内容。"]
cleanup = "释放本次 loopback 端点和临时文件，不读取或替换已安装应用。"

[[case]]
id = "AUTO-22"
title = "Executor 原生特殊文件名、长文件名双向真实收发与结果协调"
targets = ["windows", "macos", "linux", "linux-desktop"]
level = "quick"
adapter = "cargo-native-file-transfer"
prerequisite = "原生 Rust/Executor 依赖与 loopback QUIC 可用；仅使用测试创建的临时根。"
steps = ["以 Windows 未配对 UTF-16 或 Unix 非 UTF-8 文件名执行真实上传与下载。", "使用 240 字符的合法长文件名重复完整收发。", "模拟发布后结果未记录，按原始路径身份协调结果。"]
expected = ["实际文件名、完整二进制及 SHA-256 保持一致，不把转义显示名作为操作路径。", "同目录临时名不超出组件限制，发布不依赖硬链接和 Win32 长路径进程设置。", "原生目标正确核实，协调不重新传输或发布字节。"]
cleanup = "关闭本次端点、文件、SQLite 连接并回收临时根，不操作用户文件和桌面。"

[[case]]
id = "AUTO-18"
title = "文件管理原生路径、目录索引、持久任务与原子操作"
targets = ["windows", "macos", "linux", "linux-desktop"]
level = "quick"
adapter = "cargo-file-manager"
prerequisite = "原生 Rust 工具链与锁定依赖完整；整机共享编译预算可用。仅操作测试创建的临时目录。"
steps = ["运行协议和文件管理核心单元测试。", "检查归属隔离、精确字节数、稳定分页、暂停确认、重启协调及同名冲突。", "使用真实文件系统验证并发发布、原子无覆盖重命名和链接目录删除边界。"]
expected = ["所有选中测试实际通过；不把单元测试结果当作完整 GUI/实机验收。", "目录页不串账号，任务终态不可倒退，确认暂停之前不能显示已暂停。", "既有文件和外部链接目标内容保留；测试临时根自动回收。"]
cleanup = "关闭测试数据库与句柄，回收各测试创建的临时根；不访问安装应用或用户文件。"

[[case]]
id = "AUTO-19"
title = "文件管理执行端认证、隔离和持久重放"
targets = ["windows", "macos", "linux", "linux-desktop"]
level = "quick"
adapter = "cargo-file-manager-executor"
prerequisite = "Rust 与 Executor 原生依赖可用；整机共享编译预算可用。"
steps = ["运行隔离 TaskService 的文件管理请求集成测试。", "以不同 actor 读取/关闭同一目录快照；重放已完成请求。", "删除成功后在同一路径创建新数据，再用原请求 ID 重试。"]
expected = ["目录和元数据来自实际文件系统，原生路径和零字节大小不失真。", "不同 actor 不能读/关闭他人的快照；原请求返回原快照。", "只返回持久原结果，后来创建的数据没有被再次删除。"]
cleanup = "销毁本次 TaskService 临时数据库与测试目录；不连接真实远端或修改用户身份。"

[[case]]
id = "AUTO-20"
title = "文件上传流水与背压的真实 QUIC 回归"
targets = ["windows", "macos", "linux", "linux-desktop"]
level = "quick"
adapter = "cargo-upload-pipeline"
prerequisite = "Rust 与 Bridge 依赖可用；允许 loopback QUIC；整机共享编译预算可用。"
steps = ["接收端收到多个二进制帧之后才发送累计确认。", "注入非法确认，再执行完整传输。"]
expected = ["不退化为每 64 KiB 等一个 RTT；只在接收端完整校验和发布回执后成功。", "非法/倒退/越界确认被拒绝；错误与成功均归还信用额度，内存有界。"]
cleanup = "关闭本次 loopback 端点、文件和任务；不改动生产网络、Relay 或已安装应用。"

[[case]]
id = "AUTO-15"
title = "远程桌面流控、显示确认和恢复回归"
targets = ["windows", "macos", "linux", "linux-desktop"]
level = "quick"
adapter = "cargo-remote-desktop"
prerequisite = "原生工具链和 Rust 依赖完整；确认整机编译并发预算。使用 loopback QUIC，不连接生产设备。"
steps = ["执行远程桌面单元测试，检查确认回复延迟、窗口上限及有序操作。", "执行 reliable_sessions 的真实 loopback QUIC 集成测试。"]
expected = ["控制流水线最多八条消息在途，视频最多四帧在途；心跳／输入回复延迟不阻塞显示确认；输入修改串行，切屏隔离旧确认；错序或超时退出且不重放输入。", "视频背压、代次隔离、恢复及输入释放全部实际通过，无跳过。"]
cleanup = "回收本次 loopback 端点和任务；不改变安装、账号、屏幕或网络配置。"

[[case]]
id = "AUTO-16"
title = "Windows 媒体等待、进程优先级和显示布局保护"
targets = ["windows"]
level = "quick"
adapter = "cargo-media-timing"
prerequisite = "Windows 原生工具链完整；可枚举至少一块显示器，不需要账号，不采集桌面。"
steps = ["执行 windows_media_timing 的原生定时器测试。", "从低优先级父进程启动生产媒体适配器并核对实际子进程。", "检查当前输出，分别注入过期分辨率、旋转、显示器句柄和 DPI 元数据。"]
expected = ["等待不少于请求期限、旧系统定时器回退可用、句柄释放；报告实际等待耗时。", "生产媒体启动适配器从后台父进程恢复子进程的正常优先级，无跳过。", "当前布局通过；过期布局全部拒绝，不改变真实显示设置。"]
cleanup = "结束本次创建的独立测试进程；不修改全局计时精度或其他进程优先级。"

[[case]]
id = "AUTO-17"
title = "远程桌面 BGRA 转换一致性与耗时"
targets = ["windows", "macos", "linux", "linux-desktop"]
level = "quick"
adapter = "cargo-media-conversion"
prerequisite = "原生媒体工具链完整；仅使用内存中的合成像素，无需账号或远程设备。"
steps = ["执行 software::conversion_tests，比较 BT.709 标量和 SIMD 的完整 Y/U/V 数据。", "检查非对齐输入、行填充、截断和溢出尺寸，并报告 1080p 转换耗时。"]
expected = ["随机图、黑白和原色逐字节一致；透明度不影响转换；不支持 SIMD 时保留标量路径。", "无效输入拒绝且不修改输出；耗时仅用于诊断，不冒充显示帧率，也不设置依赖机器负载的速度门槛。"]
cleanup = "释放内存和测试进程；不读写用户画面，不修改安装。"

[[case]]
id = "INT-01"
title = "最新版管理平台、Relay 与客户端联调"
targets = ["management","relay","server","windows","macos","linux","linux-desktop","android"]
level = "release"
prerequisite = "管理平台、双 Relay 和客户端均使用本次最新候选产物，记录实际发布版本及 SHA-256；使用隔离数据库与测试账号。"
steps = ["部署最新版三个组件，完成登录、设备上线、实际 Relay 传输与 P2P 连接。", "验证策略下发、节点维护/恢复、连接与用量统计，以及控制服务断线重连。", "重启测试服务与客户端，重新连接并核对账号、设备身份、用量和配置。"]
expected = ["参与联调的组件均为最新候选产物，登录与两种连接路径实际成功。", "策略生效、真实操作确认及计量正确，恢复后可建立新链路。", "最新版整套功能正常，设备身份、账号、用量与配置保留。"]
cleanup = "恢复测试节点，清理本次会话与独立数据库，保留逐步观察记录。"

[[case]]
id = "SRV-02"
title = "Relay 独立部署、升级与恢复"
targets = ["relay"]
level = "release"
prerequisite = "仅使用 Relay 候选归档或镜像及已准备的隔离管理平台；记录节点 ID、证书、配置与用量存储摘要。"
steps = ["仅用 Relay 产物在测试主机部署并连接管理平台，执行真实中继传输。", "进入维护，升级一个节点，验证备用节点与原连接的实际行为。", "恢复节点并演练受支持的回退，核对原身份、配置及用量。"]
expected = ["无需客户端安装包或 Web 资源，探针与真实传输均成功。", "升级只更换目标 Relay，备用服务可用，不修改管理平台数据库。", "身份、证书、配置和待报用量保留，新链路实际可用。"]
cleanup = "恢复测试节点与连接状态，不清空用量卷，不替换私钥或设备身份。"

