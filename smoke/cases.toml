prerequisite = "使用可追溯源码和候选产物、正常测试账号及明确授权的隔离设备/目录；记录操作端、接收端、执行用户、文件系统和实际 P2P/Relay 路径。Android 仅验收适用的远端存储能力；不得用模拟 UI 或单元测试替代实际交互。"
steps = ["在本次候选和适用环境逐个执行：日志可诊断性与泄露检查", "逐个核对上述子场景的实际后置条件、原请求/结果和资源回收，保留带时间及候选指纹的脱敏证据。"]
expected = ["每次故障可定位到 batch/item/attempt 与阶段/错误码；能区分 hash/网络/写盘/发布；日志/报告无密码、token、私钥、文件内容", "每个子场景有可追溯记录；文件内容比较使用独立读取的最终 SHA-256/目录清单，状态与真实内容一致。未执行、结果未知、未清理和证据不足不能标为通过；不使用密码、token、私钥或真实文件内容作为证据。"]
cleanup = "按本次 run_id 核实任务与子进程已结束，仅回收本次创建且不再被活动/结果未知任务引用的夹具；恢复隔离故障条件。保留脱敏日志、哈希与清理证明，不修改已安装应用的身份或其他会话数据。"
