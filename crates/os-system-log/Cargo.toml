[package]
license.workspace = true
name = "pab-os-system-log"
version = "1.2.48"
edition.workspace = true
rust-version.workspace = true

[dependencies]
pab-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"

[[example]]
name = "smoke-log-probe"
path = "../../smoke/fixtures/log_probe.rs"

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_EventLog", "Win32_Storage_FileSystem"] }
quick-xml = "0.41"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
chrono = "0.4"
