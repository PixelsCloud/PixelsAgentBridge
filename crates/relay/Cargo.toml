[package]
name = "pab-relay"
version = "1.2.32"
edition.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = "0.3"
hex = "0.4"
iroh-base = "=1.2.0"
iroh-dns = "=1.3.0"
iroh-relay = { version = "=1.2.0", features = ["server"] }
n0-future = "=0.3.2"
noq = "=1.3.0"
pab-logging = { path = "../logging" }
pab-protocol = { path = "../protocol" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
iroh-relay = { version = "=1.2.0", features = ["test-utils"] }
pab-transport = { path = "../transport" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
