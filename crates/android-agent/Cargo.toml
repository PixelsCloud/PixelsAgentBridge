[package]
license.workspace = true
name = "pab-android-agent"
version = "1.2.48"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pab-agent-core = { path = "../agent-core" }
pab-command-runtime = { path = "../command-runtime" }
pab-terminal = { path = "../terminal" }
pab-interactive-terminal = { path = "../interactive-terminal" }
pab-device-session = { path = "../device-session" }
pab-document = { path = "../document", default-features = false }
pab-file-codec = { path = "../file-codec" }
pab-protocol = { path = "../protocol" }
pab-screenshot = { path = "../screenshot" }
pab-service-config = { path = "../service-config" }
pab-task-runtime = { path = "../task-runtime" }
pab-transport = { path = "../transport" }
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["fs"] }
toml = "1"
url = "2"
iroh-base = { version = "=1.2.0", features = ["key"] }
zeroize = "1"
uuid.workspace = true
blake3 = "1"
sha2 = "0.10"
globset = "0.4.20"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
iroh-relay = { version = "=1.2.0", features = ["server"] }
tempfile = "3"
futures-util = "0.3"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
jni = "=0.21.1"
jni22 = { package = "jni", version = "=0.22.4" }
ndk-context = "0.1.1"
rustls-platform-verifier = "=0.7.0"
