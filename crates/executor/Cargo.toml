[package]
name = "pab-executor"
version = "1.2.24"
edition.workspace = true
rust-version.workspace = true

[dependencies]
bollard = { version = "=0.21.1", default-features = false, features = ["pipe"] }
argon2 = "0.5"
futures-util = "0.3"
hmac = "0.12"
globset = "0.4.20"
regex = "1.13.1"
same-file = "1.0.6"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
iroh-base = { version = "=1.2.0", features = ["key"] }
pab-agent-core = { path = "../agent-core" }
pab-logging = { path = "../logging" }
pab-platform = { path = "../platform" }
pab-protocol = { path = "../protocol" }
pab-screenshot = { path = "../screenshot" }
pab-task-runtime = { path = "../task-runtime" }
pab-terminal = { path = "../terminal" }
pab-transport = { path = "../transport" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
zeroize = "1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
axum = "0.8"
bollard = { version = "=0.21.1", default-features = false, features = ["http"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
pab-windows-sas = { path = "../windows-sas" }
