[package]
name = "pab-server"
version = "1.2.48"
edition.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
blake3 = "1"
futures-util = "0.3"
iroh-base = { version = "=1.2.0", features = ["key"] }
pab-logging = { path = "../logging" }
pab-protocol = { path = "../protocol" }
pab-task-runtime = { path = "../task-runtime" }
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true
serde.workspace = true
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio-rustls",
    "time",
    "uuid",
] }
subtle = "2"
thiserror.workspace = true
tracing.workspace = true
time = "0.3"
tokio.workspace = true
unicode-normalization = "0.1"
uuid.workspace = true
url = "2"
oauth2 = { version = "=5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-std"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
pab-agent-core = { path = "../agent-core" }
pab-bridge = { path = "../bridge" }
pab-executor = { path = "../executor" }
pab-platform = { path = "../platform" }
pab-relay = { path = "../relay" }
pab-transport = { path = "../transport" }
rcgen = "0.14"
tempfile = "3"
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
zeroize = "1"
