[package]
license.workspace = true
name = "pab-agent-core"
version = "1.2.48"
edition.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
# Retain proxy discovery, SOCKS environments and OS-trusted interception CAs with Rustls.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "system-proxy", "socks"] }
tracing.workspace = true
serde.workspace = true
url = "2"
futures-util = "0.3"
iroh-base = { version = "=1.2.0", features = ["key"] }
pab-protocol = { path = "../protocol" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde_json.workspace = true
thiserror.workspace = true
time = "0.3"
tokio = { workspace = true, features = ["sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
webpki-roots = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tracing-subscriber.workspace = true
