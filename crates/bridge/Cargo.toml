[package]
name = "pab-bridge"
version = "1.2.39"
edition.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = "0.3"
base64 = "0.22"
argon2 = "0.5"
iroh-base = { version = "=1.2.0", features = ["key"] }
pab-agent-core = { path = "../agent-core" }
pab-logging = { path = "../logging" }
pab-protocol = { path = "../protocol" }
pab-screenshot = { path = "../screenshot" }
pab-transport = { path = "../transport" }
rand_core = { version = "0.6", features = ["getrandom"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
uuid.workspace = true
sha2 = "0.10"
zeroize = "1"
tempfile = "3"

[dev-dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-io"] }
