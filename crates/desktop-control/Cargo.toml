[package]
name = "pab-desktop-control"
version = "1.2.26"
edition.workspace = true
rust-version.workspace = true
[dependencies]
pab-protocol = { path = "../protocol" }
serde_json.workspace = true
serde.workspace = true
pab-os-control = { path = "../os-control" }
pab-screenshot = { path = "../screenshot" }
[target.'cfg(any(target_os="windows",target_os="linux",target_os="macos"))'.dependencies]
xcap = "=0.8.2"
enigo = { version="=0.5.0",default-features=false,features=["x11rb"] }
[target.'cfg(windows)'.dependencies]
uiautomation = { version = "=0.25.1", default-features = false, features = ["pattern", "input"] }
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Threading", "Win32_System_Registry", "Win32_Storage_EnhancedStorage"] }
windows-sys = {version="0.61",features=["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_Graphics_Gdi","Win32_System_LibraryLoader","Win32_UI_Input_KeyboardAndMouse","Win32_System_RemoteDesktop"]}
[target.'cfg(target_os="linux")'.dependencies]
x11rb = "=0.13.2"

[target.'cfg(target_os="macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSError"] }
block2 = "=0.6.2"
plist = "1"
accessibility = "=0.2.0"
accessibility-sys = "=0.2.0"
core-foundation = "=0.10.1"
dispatch2 = "=0.3.1"
libc = "0.2"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFString"] }
objc2-io-kit = { version = "=0.3.2", default-features = false, features = ["std", "pwr_mgt"] }
