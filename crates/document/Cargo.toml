[package]
license.workspace = true
name = "pab-document"
version = "1.2.48"
edition.workspace = true
rust-version.workspace = true

[features]
default = ["native-runtime"]
native-runtime = ["dep:xberg-tesseract", "dep:pdfium-render"]

[dependencies]
pab-protocol = { path = "../protocol" }
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4"
calamine = "=0.36.1"
quick-xml = "=0.41.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
html2text = "=0.17.1"
lopdf = "=0.42.0"
thiserror.workspace = true
anydoc = "=0.2.4"
pdf-inspector = "=1.14.2"
xberg-tesseract = { version = "=1.3.8", optional = true, default-features = false, features = ["static-linking"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pdfium-render = { version = "=0.8.37", optional = true, default-features = false, features = ["pdfium_latest", "thread_safe", "image_025"] }
tokio = { workspace = true, features = ["rt", "macros"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
