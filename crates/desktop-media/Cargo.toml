[package]
license.workspace = true
name = "pab-desktop-media"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
pab-protocol = { path = "../protocol" }
pab-remote-desktop = { path = "../remote-desktop" }
serde_json.workspace = true
tokio.workspace = true
openh264 = "=0.9.8"
openh264-sys2 = "=0.9.9"

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control", "image-data"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[[bin]]
name = "pab-media-worker"
path = "src/main.rs"

[[example]]
name = "remote_desktop_color"
path = "../../smoke/remote_desktop_color.rs"

[[example]]
name = "image_clipboard_check"
path = "../../smoke/image_clipboard_check.rs"
