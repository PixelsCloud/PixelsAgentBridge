[package]
license.workspace = true
name = "pab-desktop-media"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
pab-protocol = { path = "../protocol" }
pab-remote-desktop = { path = "../remote-desktop" }
serde_json.workspace = true
tokio.workspace = true
openh264 = "=0.9.8"
openh264-sys2 = "=0.9.9"

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[[bin]]
name = "pab-media-worker"
path = "src/main.rs"

[[example]]
name = "remote_desktop_color"
path = "../../smoke/remote_desktop_color.rs"
