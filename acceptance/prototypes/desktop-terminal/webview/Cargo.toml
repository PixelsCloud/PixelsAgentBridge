[package]
name = "terminal-proof-webview"
version = "0.0.0"
edition = "2024"
[workspace]
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
[build-dependencies]
tauri-build = "=2.6.3"
[dependencies]
tauri = "=2.11.6"
tokio = { version = "=1.53.1", features = ["net", "io-util", "sync", "time"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_ProcessStatus"] }
[profile.release]
strip = true
