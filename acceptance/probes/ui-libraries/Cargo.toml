[package]
name = "pab-ui-library-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "=0.25.1", default-features = false, features = ["pattern", "input"] }
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os="macos")'.dependencies]
accessibility = "=0.2.0"
accessibility-sys = "=0.2.0"
core-foundation = "=0.10.1"
