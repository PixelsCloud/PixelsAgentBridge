name: pixels-agent-bridge

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAB_DB_NAME:-pab}
      POSTGRES_USER: pab
      POSTGRES_PASSWORD: ${PAB_DB_PASSWORD:?set PAB_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pab -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pab-internal

  init:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    image: ${PAB_SERVER_IMAGE:-pixels-agent-bridge:release}
    command: ["pab-server", "init", "--config", "/etc/pab/pab-server.toml"]
    restart: "no"
    volumes:
      - type: bind
        source: ${PAB_SERVER_CONFIG:-./config/pab-server.toml}
        target: /etc/pab/pab-server.toml
        bind:
          create_host_path: false
        read_only: true
      - backend-logs:/var/log/pab
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pab-internal

  backend:
    image: ${PAB_SERVER_IMAGE:-pixels-agent-bridge:release}
    command: ["pab-server", "serve", "--config", "/etc/pab/pab-server.toml"]
    restart: unless-stopped
    init: true
    volumes:
      - type: bind
        source: ${PAB_SERVER_CONFIG:-./config/pab-server.toml}
        target: /etc/pab/pab-server.toml
        bind:
          create_host_path: false
        read_only: true
      - backend-logs:/var/log/pab
      - type: bind
        source: ${PAB_CERT_DIR:-./certs}
        target: /run/pab-certs
        read_only: true
    ports:
      - "${PAB_BACKEND_HOST_IP:-127.0.0.1}:${PAB_BACKEND_HOST_PORT:-31400}:8443"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/run/pab-certs/backend-ca.pem", "--resolve", "${PAB_BACKEND_DNS_ALIAS:-backend}:8443:127.0.0.1", "https://${PAB_BACKEND_DNS_ALIAS:-backend}:8443/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      pab-internal:
        aliases:
          - ${PAB_BACKEND_DNS_ALIAS:-backend}

  relay:
    # Multiple Relay instances must each set a distinct persistent node ID.
    image: ${PAB_RELAY_IMAGE:-${PAB_SERVER_IMAGE:-pixels-agent-bridge:release}}
    command: ["pab-relay-server", "--config", "/etc/pab/pab-relay-server.toml"]
    restart: unless-stopped
    init: true
    volumes:
      - type: bind
        source: ${PAB_RELAY_CONFIG:-./config/pab-relay-server.toml}
        target: /etc/pab/pab-relay-server.toml
        bind:
          create_host_path: false
        read_only: true
      - relay-logs:/var/log/pab
      - relay-usage:/var/lib/pab/usage
      - type: bind
        source: ${PAB_CERT_DIR:-./certs}
        target: /run/pab-certs
        read_only: true
    ports:
      - "${PAB_RELAY_HTTPS_HOST_IP:-127.0.0.1}:${PAB_RELAY_HTTPS_HOST_PORT:-31443}:31443/tcp"
      - "${PAB_RELAY_QUIC_HOST_IP:-0.0.0.0}:${PAB_RELAY_QUIC_HOST_PORT:-7842}:7842/udp"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/run/pab-certs/relay-ca.pem", "--resolve", "${PAB_RELAY_DNS_ALIAS:-relay}:31443:127.0.0.1", "https://${PAB_RELAY_DNS_ALIAS:-relay}:31443/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      backend:
        condition: service_healthy
    networks:
      pab-internal:
        aliases:
          - ${PAB_RELAY_DNS_ALIAS:-relay}

networks:
  pab-internal:

volumes:
  postgres-data:
  backend-logs:
  relay-logs:
  relay-usage:
