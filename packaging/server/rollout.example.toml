# image = "registry.example/pixels@sha256:REPLACE_WITH_64_HEX_DIGEST"

[[nodes]]
node_id = "relay-windows-1"
platform = "windows"
transport = "ssh"
ssh_host = "192.0.2.20"
ssh_user = "Administrator"
identity_file = "deploy-key"
known_hosts = "known_hosts"
install_directory = 'C:\PixelsRelay'
service_name = "PixelsAgentBridgeRelay"
config_file = 'C:\PixelsRelay\relay.toml'
artifact = "pixels-agent-bridge-relay-windows-x86_64-release-VERSION.zip"
sha256 = "REPLACE_WITH_ARCHIVE_SHA256"
