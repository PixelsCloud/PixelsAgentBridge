listen = "0.0.0.0:8443"
[database]
url = "postgres://pab:replace-password@database.example:5432/pab"
[tls]
cert = "../certs/server.pem"
key = "../certs/server-key.pem"
[web]
origin = "https://server.example:8443"
registration_enabled = true
assets = "../web"
[relay]
control_secret = "replace-with-distinct-legacy-secret-at-least-32-bytes"
[relay.directory]
[[relay.directory.nodes]]
node_id = "win-90-test"
url = "https://relay-windows.example:31443/"
control_secret = "replace-with-this-nodes-own-control-secret-at-least-32-bytes"
# Omitted capacity_mbps defaults to 200 Mbps; explicit 0 removes the node cap.
[log]
directory = "../logs/server"
level = "info"
