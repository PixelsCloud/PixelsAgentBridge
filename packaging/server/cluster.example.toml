# Static catalog is part of the central Server's existing TOML, not public client secrets.
listen = "0.0.0.0:8443"
[database]
url = "postgres://pab:replace-password@database.example:5432/pab"
[tls]
cert = "certs/server.pem"
key = "certs/server-key.pem"
[web]
origin = "https://server.example:8443"
registration_enabled = true
assets = "web"
[relay]
control_secret = "replace-with-a-distinct-legacy-secret-at-least-32-bytes"
[relay.directory]
heartbeat_seconds = 5
offline_seconds = 15
recovery_seconds = 10
maintenance_seconds = 30

[[relay.directory.nodes]]
node_id = "linux-a"
url = "https://relay-a.example:31443"
region = "test-a"
weight = 100
# capacity_mbps = 200 # Defaults to 200 Mbps; explicit 0 retains uncapped mode.
control_secret = "replace-with-unique-linux-a-node-secret-at-least-32-bytes"

[[relay.directory.nodes]]
node_id = "windows-90"
url = "https://relay-b.example:31443"
region = "test-b"
weight = 100
# capacity_mbps = 200
control_secret = "replace-with-unique-windows-b-node-secret-at-least-32-bytes"

[log]
directory = "logs/server"
level = "info"
