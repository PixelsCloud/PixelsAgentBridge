<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Pixels Agent Bridge — 让 AI 跨设备执行任务</title>
  <desc id="desc">深蓝色品牌横幅。AI Agent 通过 Pixels 连接电脑、服务器和 Android 设备。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08151f"/><stop offset="1" stop-color="#102833"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#28cbb1" stop-opacity=".17"/><stop offset="1" stop-color="#28cbb1" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="1008" y1="240" x2="1364" y2="240"><stop stop-color="#2a716f"/><stop offset="1" stop-color="#65e4c8"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7edcc7" opacity=".09"/></pattern>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="m0 0 5 3-5 3" fill="none" stroke="#66c6b8" stroke-width="1.2"/></marker>
    <g id="mark" fill="#67e2c6" stroke="#67e2c6" stroke-linejoin="round">
      <path d="M0-29-30 23H30Z" fill="none" stroke-width="5"/>
      <circle cy="-29" r="8" stroke="none"/><circle cx="-30" cy="23" r="8" stroke="none"/><circle cx="30" cy="23" r="8" stroke="none"/>
    </g>
    <style>
      text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif}
      .muted{fill:#9eb8c3}.label{fill:#dceeea;font-size:19px;font-weight:500}.icon{fill:none;stroke:#a8dfd4;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="480" rx="24" fill="url(#bg)"/>
  <rect x="836" y="1" width="763" height="478" rx="24" fill="url(#dots)"/>
  <ellipse cx="1190" cy="240" rx="390" ry="335" fill="url(#halo)"/>
  <rect x=".75" y=".75" width="1598.5" height="478.5" rx="23" fill="none" stroke="#33505b" stroke-opacity=".6" stroke-width="1.5"/>
  <path d="M74 58H110" stroke="#67e2c6" stroke-width="3"/>
  <text x="124" y="64" fill="#8ec9bd" font-size="16" letter-spacing="3">AI × REMOTE DEVICES</text>
  <text x="70" y="168" fill="#f1f7f8" font-size="66" font-weight="700" letter-spacing="-2.5">Pixels <tspan font-weight="400">Agent Bridge</tspan></text>
  <text x="74" y="242" fill="#71e4ca" font-size="43" font-weight="600" letter-spacing="2">让 AI 跨设备执行任务</text>
  <text x="76" y="297" fill="#b5cbd2" font-size="22">一句话，连接你的电脑、服务器与手机。</text>
  <g fill="#d5e6e8" font-size="20">
    <text x="76" y="363">远程桌面</text><circle cx="182" cy="356" r="2.5" fill="#4b847f"/>
    <text x="205" y="363">文件传输</text><circle cx="311" cy="356" r="2.5" fill="#4b847f"/>
    <text x="334" y="363">终端</text><circle cx="400" cy="356" r="2.5" fill="#4b847f"/>
    <text x="423" y="363">MCP</text>
  </g>
  <text x="76" y="426" class="muted" font-size="16" letter-spacing="1">Windows / macOS / Linux / Android</text>
  <path d="M824 74V406" stroke="#31515a" stroke-opacity=".5"/>
  <!-- Connections sit behind the component shapes. -->
  <g fill="none" stroke="url(#line)" stroke-width="2" marker-end="url(#arrow)">
    <path d="M1008 240H1102"/>
    <path d="M1240 240H1354"/>
    <path d="M1215 203C1275 203 1278 112 1354 112"/>
    <path d="M1215 277C1275 277 1278 368 1354 368"/>
  </g>
  <circle cx="1170" cy="240" r="119" fill="none" stroke="#5bd4bc" stroke-opacity=".08"/>
  <circle cx="1170" cy="240" r="95" fill="none" stroke="#5bd4bc" stroke-opacity=".13" stroke-dasharray="3 9"/>
  <rect x="884" y="187" width="124" height="106" rx="22" fill="#112a35" stroke="#3b666e"/>
  <path d="m946 205 7 20 20 7-20 7-7 20-7-20-20-7 20-7Z" fill="none" stroke="#a8dfd4" stroke-width="2.5"/>
  <path d="m975 205 2 6 6 2-6 2-2 6-2-6-6-2 6-2Z" fill="#67e2c6"/>
  <text x="946" y="279" text-anchor="middle" fill="#dceeea" font-size="17" font-weight="600">AI Agent</text>
  <text x="1055" y="221" text-anchor="middle" class="muted" font-size="13" letter-spacing="1.5">MCP</text>
  <circle cx="1170" cy="240" r="68" fill="#112e36" stroke="#60d8bd" stroke-width="1.5"/>
  <use href="#mark" transform="translate(1170 232) scale(1.12)"/>
  <text x="1170" y="352" text-anchor="middle" fill="#71e4ca" font-size="23" font-weight="600" letter-spacing="1">Pixels</text>
  <g>
    <rect x="1364" y="73" width="162" height="78" rx="16" fill="#112a35" stroke="#345d66"/>
    <g class="icon" transform="translate(1385 93)"><rect width="37" height="25" rx="3"/><path d="M18.5 25v8m-10 0h20"/></g>
    <text x="1441" y="120" class="label">电脑</text>
    <rect x="1364" y="201" width="162" height="78" rx="16" fill="#112a35" stroke="#345d66"/>
    <g class="icon" transform="translate(1386 221)"><rect width="35" height="15" rx="3"/><rect y="21" width="35" height="15" rx="3"/><path d="M7 7.5h1m-1 21h1m12-21h8m-8 21h8"/></g>
    <text x="1441" y="249" class="label">服务器</text>
    <rect x="1364" y="329" width="162" height="78" rx="16" fill="#112a35" stroke="#345d66"/>
    <g class="icon" transform="translate(1392 345)"><rect width="24" height="43" rx="5"/><path d="M9 6h6m-4 30h2"/></g>
    <text x="1435" y="376" fill="#dceeea" font-size="18" font-weight="500">Android</text>
  </g>
</svg>
